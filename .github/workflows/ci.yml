name: CI

# Build verification on every push/PR. The build step is the same `vite build`
# Railway runs on deploy, so a green check here means the bundle compiles before
# it reaches production. (Type-check is informational and does not block.)
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (vite) — gate, same command as Railway deploy
        run: npm run build

      - name: Type-check (informational, non-blocking)
        run: npx tsc --noEmit
        continue-on-error: true
